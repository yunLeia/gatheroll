services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gatheroll
      POSTGRES_PASSWORD: gatheroll
      POSTGRES_DB: gatheroll
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatheroll -d gatheroll"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
